syntax = "proto3";

package internal;

option go_package = "github.com/ehrlich-b/tunn/pkg/proto/internalv1";

service InternalService {
  rpc CheckForwardedPermission(ForwardedPermissionRequest) returns (ForwardedPermissionResponse);
  rpc ListAccountTunnels(ListAccountTunnelsRequest) returns (ListAccountTunnelsResponse);
  rpc FindTunnel(FindTunnelRequest) returns (FindTunnelResponse);
  rpc GetNodeInfo(NodeInfoRequest) returns (NodeInfoResponse);
}

// LoginNodeDB is the service that only the login node implements.
// Non-login nodes proxy these calls to the login node.
service LoginNodeDB {
  rpc TunnelAlert(TunnelAlertRequest) returns (TunnelAlertResponse);
  // Usage tracking
  rpc RecordUsage(RecordUsageRequest) returns (RecordUsageResponse);
  rpc GetMonthlyUsage(GetMonthlyUsageRequest) returns (GetMonthlyUsageResponse);

  // Device codes for CLI login
  rpc CheckManagementDevice(CheckManagementDeviceRequest) returns (CheckManagementDeviceResponse);
  rpc CreateDeviceCode(CreateDeviceCodeRequest) returns (DeviceCodeResponse);
  rpc GetDeviceCode(GetDeviceCodeRequest) returns (DeviceCodeResponse);
  rpc AuthorizeDeviceCode(AuthorizeDeviceCodeRequest) returns (AuthorizeDeviceCodeResponse);

  // Account management
  rpc GetAccount(GetAccountRequest) returns (AccountResponse);
  rpc RevokeBrowserSessions(RevokeBrowserSessionsRequest) returns (RevokeBrowserSessionsResponse);
  rpc GetAccountByEmail(GetAccountByEmailRequest) returns (AccountResponse);
  rpc FindOrCreateByEmails(FindOrCreateByEmailsRequest) returns (AccountResponse);
  rpc MutateAccountEmail(MutateAccountEmailRequest) returns (AccountResponse);
  rpc GetEmailBucket(GetEmailBucketRequest) returns (GetEmailBucketResponse);
  rpc UpdatePlan(UpdatePlanRequest) returns (UpdatePlanResponse);

  // Active tunnel tracking (cross-node)
  rpc RegisterTunnel(RegisterTunnelRequest) returns (RegisterTunnelResponse);
  rpc UnregisterTunnel(UnregisterTunnelRequest) returns (UnregisterTunnelResponse);
  rpc GetTunnelCount(GetTunnelCountRequest) returns (GetTunnelCountResponse);

  // Magic link replay protection (cross-node)
  rpc MarkMagicTokenUsed(MarkMagicTokenUsedRequest) returns (MarkMagicTokenUsedResponse);

  // Magic link rate limiting (per-email throttle)
  rpc CheckMagicLinkRateLimit(CheckMagicLinkRateLimitRequest) returns (CheckMagicLinkRateLimitResponse);

  // Durable payment intake, authenticated by the existing internal node gate.
  rpc ProcessBillingEvent(ProcessBillingEventRequest) returns (ProcessBillingEventResponse);
  rpc IntakeReport(IntakeReportRequest) returns (IntakeReportResponse);
  rpc BugReportHTTP(BugReportHTTPRequest) returns (BugReportHTTPResponse);
  rpc BeginBillingCheckout(BeginBillingCheckoutRequest) returns (BeginBillingCheckoutResponse);
  // Live app credentials and expiring concurrency leases; never carries raw secrets.
  rpc AppDeviceCheck(AppDeviceCheckRequest) returns (AppDeviceCheckResponse);
}

message TunnelAlertRequest {
  string operation = 1; // up, heartbeat, down, graceful, error, settings, save_settings
  string account_id = 2;
  string tunnel = 3;
  string session = 4;
  string last_error = 5;
  bool enabled = 6;
  int64 threshold_seconds = 7;
  bool on_graceful_stop = 8;
}
message TunnelAlertResponse {
  bool enabled = 1;
  int64 threshold_seconds = 2;
  bool on_graceful_stop = 3;
}


// Node information for login node discovery
message NodeInfoRequest {}

message NodeInfoResponse {
  bool is_login_node = 1;
  string node_id = 2;
}

message FindTunnelRequest {
  string tunnel_id = 1;
}

message FindTunnelResponse {
  bool found = 1;
  // The address of the node handling the tunnel.
  // If found is true, this will be the address of the node.
  // The caller can then use this address to forward the request.
  string node_address = 2;
  // Live publisher ownership for the login node's MCP consent checks.
  string account_id = 3;
  string creator_email = 4;
  string endpoint_kind = 5;
  repeated string allowed_emails = 6;
  string resource_id = 7;
}

message AppDeviceCheckRequest {
  string operation = 1; // resolve, acquire, renew, release, failure
  bytes token_sha256 = 2;
  string source = 3;
  string hostname = 4;
  string device_id = 5;
  string lease_id = 6;
}
message AppDeviceCheckResponse {
  int32 status = 1;
  bytes device_json = 2; // non-secret scope and lifecycle metadata only
}

// Usage tracking messages
message RecordUsageRequest {
  string account_id = 1;
  int64 bytes = 2;
}

message RecordUsageResponse {}

message GetMonthlyUsageRequest {
  string account_id = 1;
}

message GetMonthlyUsageResponse {
  int64 bytes_used = 1;
}

// Device code messages
message CreateDeviceCodeRequest { string purpose = 1; string account_id = 2; }
message CheckManagementDeviceRequest { string device_id = 1; string email = 2; string account_id = 3; }
message CheckManagementDeviceResponse { bool valid = 1; }

message DeviceCodeResponse {
  string code = 1;
  string user_code = 2;
  int64 expires_at = 3;
  int32 interval = 4;
  bool authorized = 5;
  string email = 6;
  bool found = 7;
  string purpose = 8;
  string account_id = 9;
}

message GetDeviceCodeRequest {
  string code = 1;
  string user_code = 2;  // If set, lookup by user_code instead
}

message AuthorizeDeviceCodeRequest {
  string code = 1;
  string email = 2;
}

message AuthorizeDeviceCodeResponse {
  bool success = 1;
}

// Account messages
message AccountResponse {
  bool found = 1;
  string id = 2;
  string primary_email = 3;
  string plan = 4;
  int64 created_at = 5;
  repeated AccountEmail emails = 6;
  string operational_state = 7;
  int64 operational_version = 8;
  string billing_state = 9;
  string billing_notice = 10;
  string browser_session_epoch = 11;
}

message AccountEmail {
  string email = 1;
  string verified_via = 2;
  int64 added_at = 3;
}

message RevokeBrowserSessionsRequest {
  string account_id = 1;
  string expected_epoch = 2;
}

message RevokeBrowserSessionsResponse {}

message GetAccountRequest {
  string account_id = 1;
}

message GetAccountByEmailRequest {
  string email = 1;
}

message FindOrCreateByEmailsRequest {
  repeated string emails = 1;
  string verified_via = 2;
  // A Google identity must be attached atomically at the login-node authority.
  string google_subject = 3;
  string google_hosted_domain = 4;
  bool google_email_verified = 5;
}

message GetEmailBucketRequest {
  string email = 1;
}

message GetEmailBucketResponse {
  repeated string emails = 1;
}

message UpdatePlanRequest {
  string account_id = 1;
  string plan = 2;
}

message UpdatePlanResponse {}

// Tunnel tracking messages
message RegisterTunnelRequest {
  string tunnel_id = 1;
  string account_id = 2;
  string node_address = 3;
}

message RegisterTunnelResponse {
  bool allowed = 1;
  string reason = 2;
  int32 current_count = 3;
  int32 max_allowed = 4;
}

message UnregisterTunnelRequest {
  string tunnel_id = 1;
}

message UnregisterTunnelResponse {}

message GetTunnelCountRequest {
  string account_id = 1;
}

message GetTunnelCountResponse {
  int32 count = 1;
}

// Magic link replay protection messages
message MarkMagicTokenUsedRequest {
  string jti = 1;
  int64 expiry_unix = 2;  // When the token expires (for cleanup)
}

message MarkMagicTokenUsedResponse {
  bool was_unused = 1;  // true if token was unused and is now marked, false if already used
}

// Magic link rate limiting messages
message CheckMagicLinkRateLimitRequest {
  string email = 1;
}

message CheckMagicLinkRateLimitResponse {
  bool allowed = 1;           // true if request is allowed
  int32 remaining = 2;        // requests remaining in window
  int64 reset_at_unix = 3;    // when the rate limit resets
}

message ProcessBillingEventRequest { bytes event_json = 1; }
message ProcessBillingEventResponse { bytes result_json = 1; }
message IntakeReportRequest { string account_id = 1; string category = 2; string endpoint = 3; }
message IntakeReportResponse { bytes report_json = 1; }

message BeginBillingCheckoutRequest { string account_id = 1; string destination = 2; }
message BeginBillingCheckoutResponse { string reference = 1; string destination = 2; }

message ForwardedPermissionRequest {
 string tunnel_id = 1; string host = 2; string path = 3; string method = 4;
 string peer = 5; string scheme = 6; map<string,string> headers = 7;
 bool admission = 8;
}
message ForwardedPermissionResponse { bool allowed = 1; int32 status = 2; string location = 3; repeated string challenges = 4; uint32 version = 5; string request_id = 6; }

// Explicit mailbox management never merges accounts.
message MutateAccountEmailRequest {
  string account_id = 1;
  string email = 2;
  string action = 3; // link, primary
  string token_jti = 4;
  int64 token_expires_at = 5;
}

// Live connection metadata only; caller is authenticated by the node gate.
message ListAccountTunnelsRequest { string account_id = 1; }
message ListAccountTunnelsResponse {
  repeated AccountTunnel tunnels = 1;
  // Some owner lookups failed; all returned rows still have proven ownership.
  bool partial = 2;
}
message AccountTunnel {
  string name = 1;
  string kind = 2;
  string public_url = 3;
  int64 connected_since_unix = 4;
  string client_version = 5;
  string client_host = 6;
  int64 last_request_unix = 7;
}

message BugReportHTTPRequest { string method = 1; string path = 2; string query = 3; bytes body = 4; string content_type = 5; string authorization = 6; string remote_addr = 7; }
message BugReportHTTPResponse { int32 code = 1; bytes body = 2; string content_type = 3; }
