syntax = "proto3";
package metering;
option go_package = "github.com/ehrlich-b/tunn/pkg/proto/meteringv1";
import "google/protobuf/empty.proto";

// Only the login node serves this API, behind the existing node-secret interceptor.
service Metering {
  rpc Audit(AuditRequest) returns (AuditResponse);
  rpc IPPolicy(IPPolicyRequest) returns (.metering.IPPolicy);

  rpc EndpointPolicy(EndpointPolicyRequest) returns (EndpointPolicyResponse);
  rpc Sharing(SharingRequest) returns (SharingResponse);
  rpc Resolve(ResolveRequest) returns (Grant);
  rpc CreateGrant(Grant) returns (Grant);
  rpc ListGrants(ListGrantsRequest) returns (ListGrantsResponse);
  rpc RevokeGrant(Grant) returns (google.protobuf.Empty);
  rpc Admit(Event) returns (Decision);
  // Cumulative byte counts make repeated internal RPCs idempotent.
  rpc Charge(ChargeRequest) returns (Decision);
  rpc Finish(Event) returns (google.protobuf.Empty);
  rpc Export(ExportRequest) returns (ExportResponse);
}

message Grant {
  string id = 1;
  string owner = 2;
  string endpoint = 3;
  string consumer = 4;
  bytes token_sha256 = 5;
  int64 expires_at = 6; // Unix milliseconds
  int64 requests_per_minute = 7; // fixed UTC minute; zero means unlimited
  int64 monthly_requests = 8;
  int64 monthly_bytes = 9; // request + response bodies, excluding headers
  bool revoked = 10;
}
message ResolveRequest {
  string owner = 1;
  string endpoint = 2;
  bytes token_sha256 = 3;
}
message ListGrantsRequest {
  string owner = 1;
  string endpoint = 2; // empty selects all of the owner's endpoints
}
message ListGrantsResponse {
  repeated Grant grants = 1; // credential digests are never exported
}
message Event {
  string request_id = 1;
  string owner = 2;
  string endpoint = 3;
  string caller = 4;
  string auth_method = 5;
  string grant_id = 6;
  string month = 7; // UTC admission month, including long-lived streams
  int64 started_at = 8; // Unix milliseconds
  int64 duration_ms = 9;
  bool allowed = 10;
  string reason = 11;
  int32 status = 12;
  int64 request_bytes = 13;
  int64 response_bytes = 14;
  bool finished = 15;
  bool forwarded = 16;
  int64 content_length = 17; // admission preflight only; no payload stored
  Decision admission = 18; // immutable snapshot for idempotent admission replay
}
message Decision {
  bool allowed = 1;
  string reason = 2;
  int32 status = 3;
  int64 retry_after = 4;
  int64 requests_remaining = 5; // -1 means unlimited
  int64 bytes_remaining = 6;
  int64 request_bytes = 7;
  int64 response_bytes = 8;
  string byte_budget_reason = 9; // source of the tighter remaining byte budget
}
message ChargeRequest {
  string request_id = 1;
  int64 request_bytes = 2;
  int64 response_bytes = 3;
}
message Usage {
  string owner = 1;
  string endpoint = 2;
  string caller = 3;
  string month = 4;
  int64 requests = 5;
  int64 admitted_requests = 6;
  int64 request_bytes = 7;
  int64 response_bytes = 8;
  int64 total_bytes = 9; // request + response body bytes
}
message ExportRequest {
  string owner = 1;
  string endpoint = 2;
  string month = 3;
  int64 since = 4; // Unix milliseconds; mutually exclusive with month
  int64 until = 5; // exclusive window end, Unix milliseconds
}
message ExportResponse {
  repeated Usage usage = 1;
  repeated Event events = 2;
  int32 schema_version = 3;
  string byte_unit = 4;
  bool audit_truncated = 5;
  Usage owner_usage = 6; // totals across the selected endpoints and callers
  int64 since = 7;
  int64 until = 8;
  bool usage_truncated = 9; // time-window counters may lack evicted events
}

// Durable web permissions live with the existing grant and audit authority.
message WebResource {
  string id = 1;
  string owner = 2;
  string endpoint = 3;
  string mode = 4;
  repeated Grant people = 5;
}
message SharingRequest {
  string operation = 1; // register, get, list, share, unshare
  string owner = 2;
  string endpoint = 3;
  string resource_id = 4; // binds ingress to an immutable generation
  string mode = 5;
  repeated string initial_emails = 6;
  string email = 7;
  int64 expires_at = 8;
}
message SharingResponse { repeated WebResource resources = 1; }

// Policies are scoped to an account UUID and an endpoint name; an empty name
// selects the account default. Endpoint policies replace that default.
message IPPolicyRequest {
  string operation = 1; // get, set, delete
  string owner = 2;
  string endpoint = 3;
  repeated string allow_cidrs = 4;
  repeated string deny_cidrs = 5;
}
message IPPolicy {
  repeated string allow_cidrs = 1;
  repeated string deny_cidrs = 2;
  bool inherited = 3;
  bool configured = 4; // an empty configured endpoint policy permits all IPs
}

// Owner policy configuration and atomic admission share the login authority.
message EndpointPolicyRequest {
  string operation = 1; // get, set, clear, admit
  string owner = 2;
  string endpoint = 3;
  string resource_id = 4; // mandatory immutable generation for ingress
  bytes policy_json = 5; // strict, bounded trafficpolicy.Policy JSON
  string client_ip = 6; // canonical peer, supplied only by authenticated relay
  string grant_id = 7; // revalidate revocation/expiry atomically with policy admission
}
message EndpointPolicyResponse {
  bytes policy_json = 1;
  Decision decision = 2;
}

// Reads only existing ingress metadata. Zero retention preserves capacity-based retention.
message AuditRequest {
  string owner = 1;
  string operation = 2; // list or retention
  string endpoint = 3;
  string request_id = 4;
  int32 status_class = 5;
  int64 since = 6;
  int64 until = 7;
  int64 before_started = 8;
  string before_id = 9;
  int32 limit = 10;
  int32 retention_days = 11; // 0 (existing policy), 7, 30, or 90
}
message AuditResponse {
  repeated Event events = 1;
  bool has_more = 2;
  int32 retention_days = 3;
}
