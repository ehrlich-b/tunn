[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tunn-sdk"
version = "0.0.0"
description = "Source-only Python binding for tunn's HTTP publisher"
readme = "README.md"
requires-python = ">=3.11"
# The core binding uses only the standard library and a revision-matched helper.
dependencies = []

[project.optional-dependencies]
asgi = ["uvicorn[standard]>=0.30,<1", "a2wsgi>=1.10,<2"]
test = ["uvicorn[standard]>=0.30,<1", "a2wsgi>=1.10,<2", "mcp>=1.30,<2", "build"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tunn = ["_bin/*", "py.typed"]
